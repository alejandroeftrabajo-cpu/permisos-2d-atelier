name: PERMISOS 2D - Pruebas de laboratorio

on:
  push:
    branches:
      - desarrollo-permisos-2d-from-main
    paths:
      - 'laboratorio/**'
      - 'index.html'
      - 'app.js'
      - 'data.js'
      - '.github/workflows/permisos2d-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas de permisos y roles
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas
        working-directory: laboratorio
        run: node --test tests/*.test.js
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check app.js
          node --check data.js
